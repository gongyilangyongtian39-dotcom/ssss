<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日本の遺産マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
      text-align: center;
    }

    #search {
      margin-top: 8px;
      padding: 8px 12px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    #map {
      height: calc(100vh - 110px);
    }

    .popup-img {
      width: 100%;
      max-width: 220px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .popup-place {
      font-size: 12px;
      color: #555;
    }

    .popup-title {
      font-weight: bold;
      font-size: 14px;
      margin-top: 2px;
    }

    .world {
      color: #d32f2f;
    }

    .japan {
      color: #1976d2;
    }

    .popup-desc {
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <h2>🇯🇵 日本の遺産マップ</h2>
  <input id="search" type="text" placeholder="遺産名・県名で検索">
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const heritages = [
    // 世界遺産
    {
      type: "world",
      name: "富士山",
      pref: "山梨県・静岡県",
      area: "富士山周辺",
      desc: "信仰の対象と芸術の源泉。",
      img: "https://upload.wikimedia.org/wikipedia/commons/1/12/Mount_Fuji_from_Hakone.jpg",
      lat: 35.3606,
      lng: 138.7274
    },
    {
      type: "world",
      name: "原爆ドーム",
      pref: "広島県",
      area: "広島市",
      desc: "平和の尊さを伝える記念碑。",
      img: "https://upload.wikimedia.org/wikipedia/commons/5/5c/Atomic_Bomb_Dome_2016.jpg",
      lat: 34.3955,
      lng: 132.4536
    },

    // 日本遺産
    {
      type: "japan",
      name: "出羽三山",
      pref: "山形県",
      area: "鶴岡市",
      desc: "山岳信仰が育んだ霊場。",
      img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Dewa_Sanzan.jpg",
      lat: 38.5465,
      lng: 139.9856
    },
    {
      type: "japan",
      name: "鎌倉",
      pref: "神奈川県",
      area: "鎌倉市",
      desc: "武士の都として栄えた歴史都市。",
      img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Kamakura_Great_Buddha.jpg",
      lat: 35.3192,
      lng: 139.5467
    }
  ];

  const map = L.map('map').setView([36.5, 138], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const icons = {
    world: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    }),
    japan: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    })
  };

  let markers = [];

  function showMarkers(list) {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    list.forEach(h => {
      const marker = L.marker([h.lat, h.lng], { icon: icons[h.type] })
        .addTo(map)
        .bindPopup(`
          <img class="popup-img" src="${h.img}">
          <div class="popup-place">${h.pref}｜${h.area}</div>
          <div class="popup-title ${h.type}">
            ${h.type === "world" ? "世界遺産" : "日本遺産"}：${h.name}
          </div>
          <div class="popup-desc">${h.desc}</div>
        `);

      markers.push(marker);
    });
  }

  showMarkers(heritages);

  // 検索（名前・県名対応）
  document.getElementById('search').addEventListener('input', e => {
    const key = e.target.value.toLowerCase();
    const filtered = heritages.filter(h =>
      h.name.toLowerCase().includes(key) ||
      h.pref.toLowerCase().includes(key)
    );
    showMarkers(filtered);
  });
</script>

</body>
</html>
