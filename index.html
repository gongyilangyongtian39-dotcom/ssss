<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日本の遺産マップ</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
      text-align: center;
    }

    #search {
      margin-top: 8px;
      padding: 8px 12px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    #map {
      height: calc(100vh - 110px);
    }

    .popup-title {
      font-weight: bold;
      font-size: 15px;
    }

    .world {
      color: #d32f2f;
    }

    .japan {
      color: #1976d2;
    }

    .popup-desc {
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <h2>🇯🇵 日本の遺産マップ</h2>
  <input id="search" type="text" placeholder="遺産名を検索（例：富士山）">
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 遺産データ（サンプル）
  const heritages = [
    // 世界遺産
    {
      type: "world",
      name: "富士山",
      desc: "信仰の対象と芸術の源泉。",
      lat: 35.3606,
      lng: 138.7274
    },
    {
      type: "world",
      name: "原爆ドーム",
      desc: "広島の平和記念碑。",
      lat: 34.3955,
      lng: 132.4536
    },
    {
      type: "world",
      name: "姫路城",
      desc: "日本で最も保存状態の良い城。",
      lat: 34.8394,
      lng: 134.6939
    },

    // 日本遺産
    {
      type: "japan",
      name: "出羽三山",
      desc: "山岳信仰が育んだ霊場。",
      lat: 38.5465,
      lng: 139.9856
    },
    {
      type: "japan",
      name: "鎌倉",
      desc: "武士の都として発展。",
      lat: 35.3192,
      lng: 139.5467
    },
    {
      type: "japan",
      name: "西の都 大宰府",
      desc: "古代日本の政治・文化拠点。",
      lat: 33.5213,
      lng: 130.5353
    }
  ];

  const map = L.map('map').setView([36.5, 138], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const icons = {
    world: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    }),
    japan: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    })
  };

  const markers = [];

  function showMarkers(list) {
    markers.forEach(m => map.removeLayer(m));
    markers.length = 0;

    list.forEach(h => {
      const marker = L.marker([h.lat, h.lng], { icon: icons[h.type] })
        .addTo(map)
        .bindPopup(`
          <div class="popup-title ${h.type}">
            ${h.type === "world" ? "世界遺産" : "日本遺産"}：${h.name}
          </div>
          <div class="popup-desc">${h.desc}</div>
        `);
      markers.push(marker);
    });
  }

  showMarkers(heritages);

  // 検索
  document.getElementById('search').addEventListener('input', e => {
    const key = e.target.value.toLowerCase();
    const filtered = heritages.filter(h =>
      h.name.toLowerCase().includes(key)
    );
    showMarkers(filtered);
  });
</script>

</body>
</html>
