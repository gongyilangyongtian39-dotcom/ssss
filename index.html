<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>四国 観光・グルメマップ</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
      text-align: center;
    }

    #search {
      margin-top: 8px;
      padding: 8px 12px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    #map {
      height: calc(100vh - 110px);
    }

    .popup-img {
      width: 100%;
      max-width: 220px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .popup-place {
      font-size: 12px;
      color: #555;
    }

    .popup-title {
      font-weight: bold;
      font-size: 14px;
      margin-top: 2px;
    }

    .spot {
      color: #d32f2f; /* 赤ピン */
    }

    .food {
      color: #388e3c; /* 緑ピン */
    }

    .popup-desc {
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <h2>🗾 四国 観光＆グルメマップ</h2>
  <input id="search" type="text" placeholder="名前・市町村で検索">
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const spots = [
    // 観光スポット（赤）
    {
      type: "spot",
      name: "高知城",
      city: "高知市",
      desc: "江戸時代初期に建てられた名城。",
      img: "https://upload.wikimedia.org/wikipedia/commons/2/22/Kochi_Castle_Main_Tower.jpg",
      lat: 33.5594,
      lng: 133.5310
    },
    {
      type: "spot",
      name: "桂浜",
      city: "高知市",
      desc: "坂本龍馬像で有名な海岸。",
      img: "https://upload.wikimedia.org/wikipedia/commons/0/0a/Katsurahama_beach.jpg",
      lat: 33.5169,
      lng: 133.5389
    },
    {
      type: "spot",
      name: "四万十川",
      city: "四万十市",
      desc: "日本最後の清流として知られる川。おすすめ！",
      img: "https://upload.wikimedia.org/wikipedia/commons/e/e4/Shimanto_river.jpg",
      lat: 33.2047,
      lng: 132.9347
    },
    {
      type: "spot",
      name: "道後温泉",
      city: "松山市",
      desc: "四国最古の温泉地。",
      img: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Dogo_Onsen_Honkan.jpg",
      lat: 33.8406,
      lng: 132.7650
    },

    // グルメ（緑）
    {
      type: "food",
      name: "ひろめ市場",
      city: "高知市",
      desc: "カツオのたたきや土佐料理が楽しめる市場。",
      img: "https://upload.wikimedia.org/wikipedia/commons/e/e2/Hirome_market_Kochi.jpg",
      lat: 33.5580,
      lng: 133.5305
    },
    {
      type: "food",
      name: "讃岐うどん店",
      city: "高松市",
      desc: "香川名物の讃岐うどんを味わえる。",
      img: "https://upload.wikimedia.org/wikipedia/commons/1/11/Sanuki_udon.jpg",
      lat: 34.3401,
      lng: 134.0434
    },
    {
      type: "food",
      name: "四万十川の鮎料理",
      city: "四万十市",
      desc: "鮎の塩焼きや鮎めしが人気。",
      img: "https://upload.wikimedia.org/wikipedia/commons/6/69/Ayu_grilled.jpg",
      lat: 33.2030,
      lng: 132.9330
    }
  ];

  const map = L.map('map').setView([33.7, 133.5], 7); // 四国メイン表示

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const icons = {
    spot: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    }),
    food: L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    })
  };

  let markers = [];

  function showMarkers(list) {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    list.forEach(h => {
      const marker = L.marker([h.lat, h.lng], { icon: icons[h.type] })
        .addTo(map)
        .bindPopup(`
          <img class="popup-img" src="${h.img}">
          <div class="popup-place">${h.city}</div>
          <div class="popup-title ${h.type}">${h.name}</div>
          <div class="popup-desc">${h.desc}</div>
        `);
      markers.push(marker);
    });
  }

  showMarkers(spots);

  // 検索機能（名前・市町村）
  document.getElementById('search').addEventListener('input', e => {
    const key = e.target.value.toLowerCase();
    const filtered = spots.filter(h =>
      h.name.toLowerCase().includes(key) ||
      h.city.toLowerCase().includes(key)
    );
    showMarkers(filtered);
  });
</script>

</body>
</html>
